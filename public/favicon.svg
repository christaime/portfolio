  <!-- White ".dev" -->
  <text x="50" y="82" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">.dev</text>
